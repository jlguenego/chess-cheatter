<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Assistant d'échecs local : reproduisez une position et obtenez les meilleurs coups suggérés par Stockfish, entièrement dans le navigateur."
    />
    <title>Chess Cheater</title>
    <script>
      // Applique le thème AVANT le premier rendu pour éviter le FOUC
      // (flash du thème dark par défaut avant la bascule côté React).
      // La clé et la logique doivent rester alignées avec src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("chess-cheater-theme");
          var theme =
            stored === "dark" || stored === "light" || stored === "warm80s"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
